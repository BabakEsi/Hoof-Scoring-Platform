{% extends "base.html" %}
{% load static %}

{% block title %}Edit Farm{% endblock %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/form.css' %}">
<div class="form-container">

    <div class="form-card">

        <h1>✏️ Edit Farm</h1>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Name</label>
                <input type="text" name="name" value="{{ farm.name }}">
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea name="description">{{ farm.description }}</textarea>
            </div>

            <button class="btn">Save Changes</button>

        </form>

    </div>

</div>

{% endblock %}
